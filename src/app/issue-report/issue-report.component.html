<h3 class="text-danger text-center">Report an issue</h3>
<form class="container-fluid" *ngIf="issueForm" [formGroup]="issueForm" (ngSubmit)="addIssue()">
  <div class="mb-3">
    <label for="title" class="form-label">Title</label>
    <input type="text" id="title" class="form-control" formControlName="title" />
    <div *ngIf="issueForm.get('title')?.invalid && issueForm.get('title')?.touched" class="text-danger">
      Title is required
    </div>
  </div>

  <div class="mb-3" *ngIf="suggestions.length">
    <div class="row">
      <div class="col-lg-2"></div>
      <div class="col-lg-6">
        <div class="card">
          <div class="card-header">
            Similar issues
          </div>
          <ul class="list-group list-group-flush">
            <li class="list-group-item" *ngFor="let issue of suggestions">
              <strong>#{{issue.issueNo}}: {{issue.title}}</strong>
              <p>{{issue.description}}</p>
            </li>
          </ul>
        </div>
      </div>
    </div>
  </div>

  <div class="mb-3">
    <label for="description" class="form-label">Description</label>
    <textarea id="description" class="form-control" rows="3" formControlName="description"></textarea>
  </div>

  <div class="mb-3">
    <label class="form-label">Priority</label>
    <div class="form-check form-check-inline">
      <input type="radio" id="low" class="form-check-input" value="low" formControlName="priority" />
      <label class="form-check-label" for="low">Low</label>
    </div>
    <div class="form-check form-check-inline">
      <input type="radio" id="high" class="form-check-input" value="high" formControlName="priority" />
      <label class="form-check-label" for="high">High</label>
    </div>
    <div *ngIf="issueForm.get('priority')?.invalid && issueForm.get('priority')?.touched" class="text-danger">
      Priority is required
    </div>
  </div>

  <div class="mb-3">
    <label for="type" class="form-label">Type</label>
    <select id="type" class="form-select" formControlName="type">
      <option value="Feature">Feature</option>
      <option value="Bug">Bug</option>
      <option value="Documentation">Documentation</option>
    </select>
    <div *ngIf="issueForm.get('type')?.invalid && issueForm.get('type')?.touched" class="text-danger">
      Type is required
    </div>
  </div>
  <div class="text-center">
  <button type="submit" class="btn btn-primary bg-primary">Create</button>
  <button type="button" class="btn btn-secondary bg-warning" (click)="formClose.emit()">Cancel</button>
</div>
</form>
